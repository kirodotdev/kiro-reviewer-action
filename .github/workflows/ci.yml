name: ci
on:
  pull_request:
  push:
    branches: [mainline]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check that dist matches a build of src
        # Fails on modified, deleted and new untracked files under dist/.
        run: test -z "$(git status --porcelain -- dist)" || { git status --short -- dist; exit 1; }
      - run: npm run smoke
